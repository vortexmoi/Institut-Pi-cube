<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Institut Pi au cube</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0f19;
            color: #f0f4f8;
            font-family: Arial, sans-serif;
            line-height: 1.25;
        }

        header {
            text-align: center;
            padding: 20px;
            background: #111827;
            border-bottom: 2px solid #d4af37;
        }

        h1 {
            color: #d4af37;
            margin: 0;
            font-size: 1.8rem;
        }

        .galerie-portraits {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            flex-wrap: wrap;
            background: #1f2937;
        }

        .cadre-portrait {
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .cadre-portrait:hover {
            transform: scale(1.05);
        }

        .cadre-portrait img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border: 2px solid #d4af37;
            border-radius: 50%;
            display: block;
            margin: 0 auto 8px auto;
        }

        .cadre-portrait span {
            font-size: 0.9rem;
            color: #d4af37;
            font-weight: bold;
        }

        .contenu-principal {
            padding: 30px;
            text-align: center;
        }

        .passerelles {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .bouton-passerelle {
            background-color: #111827;
            border: 1px solid #d4af37;
            color: #f0f4f8;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .bouton-passerelle:hover {
            background-color: #d4af37;
            color: #0b0f19;
        }
    </style>
</head>
<body>

    <header>
        <h1>Institut Pi au cube</h1>
    </header>

    <!-- Galerie des portraits (avec Pierre et Marie Curie) -->
    <div class="galerie-portraits">
        <div class="cadre-portrait" onclick="clicGenie('Pierre et Marie Curie')">
            <img src="pierre_et_marie_curie.jpg" alt="Pierre et Marie Curie">
            <span>Curie</span>
        </div>
        <!-- Vous pourrez ajouter d'autres portraits ici de la même manière -->
    </div>

    <div class="contenu-principal">
        <h2>Bienvenue dans l'Institut</h2>
        <p>Sélectionnez une passerelle pour explorer les départements :</p>
        
        <div class="passerelles">
            <button class="bouton-passerelle" onclick="location.href='energie.html'">Énergie</button>
            <button class="bouton-passerelle" onclick="location.href='espace.html'">Espace</button>
            <button class="bouton-passerelle" onclick="location.href='medecine.html'">Médecine</button>
        </div>
    </div>

    <script>
        function clicGenie(nom) {
            alert("Vous avez sélectionné le profil de : " + nom);
        }
    </script>

</body>
</html>
