<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Institut PiCube - Entrée</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050b14;
            color: #d4af37;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        
        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
        }

        /* Styles des images de la façade et du hall */
        .image-institut {
            width: 90vw;
            max-width: 1100px;
            height: 75vh;
            object-fit: cover;
            border: 3px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.4);
            margin-bottom: 15px;
        }

        h1, h2 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin: 5px 0;
        }

        p {
            font-size: 1rem;
            margin: 0;
        }
        
        /* Écran du hall caché par défaut */
        #conteneur-de-hall {
            display: none;
            position: relative;
        }

        /* --- L'EFFET DE MARCHE DEPUIS LA STATUE --- */
        #avatar-accueil {
            position: absolute;
            top: 42%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            opacity: 0;
            display: flex;
            align-items: center;
            background: rgba(5, 11, 20, 0.95);
            border: 2px solid #d4af37;
            border-radius: 15px;
            padding: 15px 25px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.9);
            z-index: 999;
            /* Animation simulant la marche et l'approche vers l'avant-plan */
            animation: marcheVersNous 1.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            animation-delay: 0.2s;
        }

        @keyframes marcheVersNous {
            0% {
                top: 42%;
                transform: translate(-50%, -50%) scale(0.1) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                top: 68%; /* S'avance tout à fait au premier plan */
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        @keyframes lévitationMarche {
            0% { transform: translateY(0) rotate(-1deg); filter: drop-shadow(0 0 8px #d4af37); }
            50% { transform: translateY(-8px) rotate(1deg); filter: drop-shadow(0 0 20px #d4af37); }
            100% { transform: translateY(0) rotate(-1deg); filter: drop-shadow(0 0 8px #d4af37); }
        }

        #avatar-accueil img {
            width: 100px;
            height: auto;
            margin-right: 15px;
            border: none;
            box-shadow: none;
            animation: lévitationMarche 1.5s ease-in-out infinite alternate;
        }

        .bulle-dialogue {
            text-align: left;
        }
        .bulle-dialogue h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #d4af37;
        }
        .bulle-dialogue p {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: #ffffff;
        }
        .btn-fermer {
            background: #d4af37;
            color: #050b14;
            border: none;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-fermer:hover {
            background: #fff;
        }
    </style>
</head>
<body>

    <!-- 1. LA FAÇADE -->
    <div id="conteneur-de-facade" class="page-container" onclick="entrerDansLInstitut()">
        <img src="facade.jpg" alt="Façade de l'Institut" class="image-institut">
        <h1>INSTITUT PICUBE - &pi;&sup3;</h1>
        <p><em>Cliquez n'importe où sur la façade pour entrer dans le hall</em></p>
    </div>

    <!-- 2. LE HALL -->
    <div id="conteneur-de-hall" class="page-container" onclick="event.stopPropagation();">
        <h2>Hall Circulaire de l'Institut</h2>
        <img src="hall.jpg" alt="Hall Circulaire" class="image-institut">
        <p>Bienvenue au cœur de l'Institut Pi au Cube.</p>

        <!-- PI QUI SE DÉTACHE DE LA STATUE ET S'AVANCE VERS NOUS -->
        <div id="avatar-accueil">
            <img src="logopi.jpg" alt="Avatar PiCube">
            <div class="bulle-dialogue">
                <h3>PiCube (Guide de l'Institut)</h3>
                <p>😊 Bonjour ! Comment puis-je vous aider ?</p>
                <button class="btn-fermer" onclick="fermerAccueil()">Entrer dans l'Institut</button>
            </div>
        </div>
    </div>

    <script>
        function entrerDansLInstitut() {
            var facade = document.getElementById("conteneur-de-facade");
            var hall = document.getElementById("conteneur-de-hall");
            
            if (facade && hall) {
                facade.style.display = "none";
                hall.style.display = "flex";
            }
        }

        function fermerAccueil() {
            var avatar = document.getElementById("avatar-accueil");
            if (avatar) {
                avatar.style.display = "none";
            }
        }
    </script>
</body>
</html>
