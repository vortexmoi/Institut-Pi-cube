<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Institut Picube - Entrée</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050b14;
            color: #d4af37;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        /* Écran de la façade : affiché par défaut */
        #conteneur-de-facade {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
        }
        #conteneur-de-facade img {
            width: 95vw;
            height: 80vh;
            object-fit: contain;
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            margin-bottom: 10px;
        }
        #conteneur-de-facade h1 {
            font-size: 1.8rem;
            letter-spacing: 2px;
            margin: 5px 0;
        }
        #conteneur-de-facade p {
            font-size: 1rem;
            margin: 0;
        }
        
        /* Écran du hall : TOTALEMENT CACHÉ au démarrage */
        #conteneur-de-hall {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 10px;
        }
        #conteneur-de-hall img {
            width: 95vw;
            height: 80vh;
            object-fit: contain;
            border: 3px solid #d4af37;
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.3);
            margin-bottom: 10px;
        }
        #conteneur-de-hall h2 {
            font-size: 1.8rem;
            margin: 5px 0;
        }
        #conteneur-de-hall p {
            font-size: 1rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- La Façade s'affiche en grand en premier -->
    <div id="conteneur-de-facade" onclick="entrerDansLInstitut()">
        <img src="a9fb654d-df39-4965-878d-c9711e298981.jpg" alt="Façade de l'Institut">
        <h1>INSTITUT PICUBE - &pi;&sup3;</h1>
        <p><em>Cliquez n'importe où pour entrer dans le hall</em></p>
    </div>

    <!-- Le Hall est caché et n'apparaîtra qu'après le clic grâce au script -->
    <div id="conteneur-de-hall">
        <h2>Hall Circulaire de l'Institut</h2>
        <img src="f3cae7bd-3392-4852-ae42-cde042e99639.jpg" alt="Hall Circulaire">
        <p>Bienvenue au cœur de l'Institut Pi au Cube.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
